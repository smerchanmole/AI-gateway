<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, sans-serif" fill="#cfdeeb">
  <title id="title">IA Gateway single-port architecture</title>
  <desc id="desc">Clients reach one public port. A Python edge proxy routes dashboard and API traffic to internal FastAPI and LiteLLM services, backed by YAML and SQLite, then LiteLLM calls local, OpenAI-compatible, or Cloudera models.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#122842"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#8fe7f5"/></marker>
    <style>
      .title{font:800 54px Inter,system-ui,sans-serif;fill:#fff}.subtitle{font:500 22px Inter,system-ui,sans-serif;fill:#bdd0e3}.kicker{font:800 15px Inter,system-ui,sans-serif;letter-spacing:3px;fill:#fbbf24}.boxTitle{font:800 23px Inter,system-ui,sans-serif;fill:#fff}.body{font:500 17px Inter,system-ui,sans-serif;fill:#cfdeeb}.small{font:600 14px Inter,system-ui,sans-serif;fill:#9fb5ca}.port{font:800 18px ui-monospace,monospace;fill:#081320}.route{font:700 16px ui-monospace,monospace;fill:#22d3ee}.line{fill:none;stroke:#8fe7f5;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#a78bfa;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="145" cy="85" r="320" fill="#ea580c" opacity=".12"/><circle cx="1480" cy="780" r="350" fill="#a78bfa" opacity=".09"/>
  <text x="80" y="82" class="kicker" font-size="15" font-weight="800" letter-spacing="3" fill="#fbbf24">ONE APPLICATION · ONE PUBLISHED PORT</text>
  <text x="80" y="144" class="title" font-size="54" font-weight="800" fill="#ffffff">IA Gateway architecture</text>
  <text x="80" y="184" class="subtitle" font-size="22" font-weight="500" fill="#bdd0e3">The same Python deployment works locally and in Cloudera AI Workbench.</text>

  <g filter="url(#shadow)"><rect x="80" y="278" width="250" height="240" rx="26" fill="#12243a" stroke="#39536d"/></g>
  <text x="110" y="320" class="kicker">CLIENTS</text><text x="110" y="365" class="boxTitle">Browser</text><text x="110" y="394" class="body">Admin dashboard</text>
  <text x="110" y="450" class="boxTitle">Apps and agents</text><text x="110" y="479" class="body">OpenAI-compatible SDKs</text>

  <g filter="url(#shadow)"><rect x="430" y="250" width="340" height="298" rx="28" fill="url(#orange)"/></g>
  <text x="466" y="296" class="kicker" fill="#17263a">PUBLIC ENTRY POINT</text><text x="466" y="345" class="boxTitle">Python edge proxy</text>
  <rect x="466" y="375" width="268" height="48" rx="13" fill="#fff" opacity=".94"/><text x="600" y="406" text-anchor="middle" class="port" fill="#081320" font-size="18" font-weight="800">8090 local · CDSW port</text>
  <text x="466" y="461" class="body" fill="#fff">Streaming · WebSockets · client IP</text><text x="466" y="494" class="body" fill="#fff">TLS locally / Cloudera ingress TLS</text>

  <g filter="url(#shadow)"><rect x="890" y="226" width="310" height="162" rx="25" fill="#10283e" stroke="#22d3ee"/></g>
  <text x="922" y="267" class="kicker">CONTROL PLANE</text><text x="922" y="309" class="boxTitle">FastAPI dashboard</text><text x="922" y="341" class="body">127.0.0.1:18080</text><text x="922" y="367" class="small">Login · config · logs · health</text>
  <g filter="url(#shadow)"><rect x="890" y="452" width="310" height="162" rx="25" fill="#10283e" stroke="#a78bfa"/></g>
  <text x="922" y="493" class="kicker">DATA PLANE</text><text x="922" y="535" class="boxTitle">LiteLLM Proxy</text><text x="922" y="567" class="body">127.0.0.1:14000</text><text x="922" y="593" class="small">Chat · embeddings · streaming</text>

  <path class="line" d="M330 398H430" fill="none" stroke="#8fe7f5" stroke-width="4" marker-end="url(#arrow)"/><text x="380" y="381" text-anchor="middle" class="small">HTTPS</text>
  <path class="line" d="M770 342H890" fill="none" stroke="#8fe7f5" stroke-width="4" marker-end="url(#arrow)"/><text x="830" y="322" text-anchor="middle" class="route" fill="#22d3ee">/ · /api/*</text>
  <path class="line" d="M770 470C820 470 830 533 890 533" fill="none" stroke="#8fe7f5" stroke-width="4" marker-end="url(#arrow)"/><text x="826" y="494" text-anchor="middle" class="route" fill="#22d3ee">/v1/*</text>

  <g filter="url(#shadow)"><rect x="1310" y="205" width="215" height="430" rx="27" fill="#0b1929" stroke="#425c73"/></g>
  <text x="1342" y="248" class="kicker">MODEL PROVIDERS</text>
  <rect x="1342" y="281" width="151" height="72" rx="16" fill="#17334a"/><text x="1418" y="324" text-anchor="middle" class="boxTitle">Cloudera</text>
  <rect x="1342" y="376" width="151" height="72" rx="16" fill="#17334a"/><text x="1418" y="419" text-anchor="middle" class="boxTitle">OpenAI API</text>
  <rect x="1342" y="471" width="151" height="72" rx="16" fill="#17334a"/><text x="1418" y="514" text-anchor="middle" class="boxTitle">Ollama</text>
  <rect x="1342" y="566" width="151" height="42" rx="14" fill="#17334a"/><text x="1418" y="593" text-anchor="middle" class="small">Other providers</text>
  <path class="line" d="M1200 533H1310" fill="none" stroke="#8fe7f5" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="430" y="690" width="770" height="134" rx="25" fill="#101f33" stroke="#526a80"/></g>
  <text x="466" y="732" class="kicker">LOCAL PERSISTENCE</text>
  <text x="466" y="775" class="boxTitle">config.yaml</text><text x="466" y="802" class="small">Versionable model topology</text>
  <line x1="695" y1="722" x2="695" y2="798" stroke="#39536d"/>
  <text x="735" y="775" class="boxTitle">SQLite</text><text x="735" y="802" class="small">Credentials · dynamic CDP tokens · request logs</text>
  <path class="dash" d="M1045 614V690" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/><path class="dash" d="M945 388C945 645 650 630 650 690" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 9" marker-end="url(#arrow)"/>
  <text x="1234" y="724" class="kicker">RUNTIME RULE</text><text x="1234" y="763" class="body">Token updates: no restart</text><text x="1234" y="795" class="body">Model changes: restart LiteLLM</text>
</svg>
